# Front door for the Obsidian MCP, behind a Cloudflare Tunnel.
#
# Authentication lives in the Node service on :8422, which serves the OAuth 2.1
# flow and also accepts a static bearer token. nginx only proxies here; :8420
# (the unauthenticated MCP itself) is never exposed.
server {
    listen 127.0.0.1:8421;
    server_name obsidian-mcp.example.com;

    location / {
        proxy_pass http://127.0.0.1:8422;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Streamable HTTP holds the connection open for server-sent events.
        proxy_read_timeout 1d;
        proxy_buffering off;
    }
}
